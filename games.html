<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小游戏乐园 · 宝贝攒分啦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237c5cff'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle fill='%23fff' font-family='sans-serif' font-weight='bold'%3E玩%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/common.css?v=2.17">
<style>
:root{
  --bg1:#eee7ff; --bg2:#fff8ee; --ink:#3d2d58; --ink2:#75678f;
  --purple:#7c5cff; --purple2:#9d86ff; --orange:#ff9f1a; --green:#51cf66;
  --pink:#ff8787; --paper:#fffdf8; --line:#eadff6; --shadow:0 14px 34px rgba(94,67,154,.16);
}
body{
  background:radial-gradient(120% 90% at 50% -10%, #e2d4ff 0%, transparent 60%),
    linear-gradient(180deg, var(--bg1) 0%, #fbf2f6 48%, var(--bg2) 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
  padding-bottom:44px;
}
.deco .blob{filter:blur(42px); opacity:.45;}
.deco .b1{background:#d8c8ff; top:-70px; left:-90px;}
.deco .b2{width:300px; background:#ffd8a8;}
.deco .b3{background:#b2f2bb; top:38%;}
.wrap{max-width:860px; padding:22px 16px 30px;}
.topbar{margin-bottom:18px;}
.back-link{color:var(--purple); text-decoration:none; font-size:15px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:8px 14px; box-shadow:0 3px 10px rgba(90,60,30,.08);}
h1{margin:0; font-size:34px; letter-spacing:1px;}
h1 .tw{color:var(--purple2);}
.subtitle{color:var(--ink2);}
.game-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px;}
.game-card{background:var(--paper); border:2px solid #fff; border-radius:28px; padding:24px; box-shadow:var(--shadow); cursor:pointer; text-align:left; font-family:inherit; color:inherit; transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden;}
.game-card:hover{transform:translateY(-4px); box-shadow:0 18px 42px rgba(94,67,154,.22);}
.game-card::before{content:''; position:absolute; right:-40px; top:-40px; width:140px; height:140px; border-radius:50%; opacity:.18;}
.game-card.c2048::before{background:var(--orange);}
.game-card.tic::before{background:var(--green);}
.icon{width:62px; height:62px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:16px; box-shadow:0 8px 18px rgba(0,0,0,.12);}
.c2048 .icon{background:linear-gradient(180deg,#ffd43b,#ff9f1a);}
.tic .icon{background:linear-gradient(180deg,#8ce99a,#51cf66);}
.memo .icon{background:linear-gradient(180deg,#b197fc,#8f6ce8);}
.match .icon{background:linear-gradient(180deg,#66d9e8,#3bc9db);}
.slide .icon{background:linear-gradient(180deg,#ffd8a8,#ff922b);}
.pattern .icon{background:linear-gradient(180deg,#ffa8a8,#ff8787);}
.guess .icon{background:linear-gradient(180deg,#a9e34b,#69db7c);}
.game-card h2{margin:0 0 8px; font-size:23px;}
.game-card p{margin:0; color:var(--ink2); line-height:1.7; font-size:15px;}
.tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.tag{font-size:12px; color:var(--ink2); background:#f3eefc; border:1px solid var(--line); border-radius:12px; padding:4px 10px;}
.panel{background:var(--paper); border:2px solid #fff; border-radius:28px; box-shadow:var(--shadow); padding:24px; display:none;}
.panel.show{display:block;}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
.panel-head h2{margin:0; font-size:25px;}
.btn{font-family:inherit; font-size:15px; font-weight:700; color:#fff; border:none; border-radius:30px; padding:11px 18px; cursor:pointer; background:linear-gradient(180deg,#9d86ff,#7c5cff); box-shadow:0 4px 0 #6348d6;}
.btn.secondary{background:#fff; color:var(--ink2); border:2px solid var(--line); box-shadow:0 4px 0 var(--line);}
.btn:active{transform:translateY(2px);}
.status{font-size:16px; font-weight:700; min-height:24px; margin:10px 0;}
.score-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.score-box{background:#f6f1ff; border:1.5px solid var(--line); border-radius:16px; padding:10px 16px; min-width:110px;}
.score-box .label{font-size:12px; color:var(--ink2);}
.score-box .num{font-size:24px; font-weight:900; color:var(--purple);}

/* 2048 */
.board-2048{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:420px; margin:0 auto; touch-action:none;}
.cell{aspect-ratio:1; border-radius:18px; background:#f1e8ff; display:flex; align-items:center; justify-content:center; font-size:clamp(20px,6vw,30px); font-weight:900; color:#5c4b78; box-shadow:inset 0 2px 6px rgba(90,60,120,.08);}
.cell.v2{background:#fff3bf;} .cell.v4{background:#ffd43b;} .cell.v8{background:#ffa94d;}
.cell.v16{background:#ff922b; color:#fff;} .cell.v32{background:#ff7849; color:#fff;}
.cell.v64{background:#f76707; color:#fff;} .cell.v128{background:#a9e34b;}
.cell.v256{background:#69db7c;} .cell.v512{background:#38d9a9;}
.cell.v1024{background:#3bc9db; color:#fff;} .cell.v2048{background:#7c5cff; color:#fff;}
.tip{text-align:center; color:var(--ink2); font-size:13px; margin-top:14px;}

/* 井字棋 */
.tic-board{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(0,1fr)); gap:12px; width:min(100%,360px); aspect-ratio:1; margin:0 auto;}
.tic-cell{width:100%; height:100%; min-width:0; min-height:0; border-radius:20px; background:#f1f8ec; border:2px solid #d8f3cf; display:flex; align-items:center; justify-content:center; font-size:clamp(30px,9vw,44px); font-weight:900; cursor:pointer; line-height:1; padding:0;}
.tic-cell.x{color:var(--purple);} .tic-cell.o{color:var(--orange);}
.tic-cell.win{background:#d3f9d8; border-color:#8ce99a;}
.mode-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.mode-btn{font-family:inherit; border:2px solid var(--line); background:#fff; color:var(--ink2); border-radius:20px; padding:9px 14px; cursor:pointer; font-weight:700;}
.mode-btn.active{background:var(--purple); color:#fff; border-color:var(--purple);}

/* 通用益智游戏 */
.mini-grid{display:grid; gap:12px; width:min(100%,360px); margin:0 auto;}
.memo-grid{grid-template-columns:repeat(4,1fr);}
.memo-card{aspect-ratio:1; border-radius:18px; border:2px solid var(--line); background:#f3eefc; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; font-family:inherit; color:transparent; transition:transform .12s;}
.memo-card.open{background:#fff; color:var(--ink); border-color:var(--purple2);}
.memo-card.matched{background:#d3f9d8; color:var(--green); border-color:#8ce99a; cursor:default;}
.match-cols{display:grid; grid-template-columns:1fr 1fr; gap:18px; width:min(100%,420px); margin:0 auto;}
.match-list{display:flex; flex-direction:column; gap:10px;}
.match-item{border:2px solid var(--line); background:#fff; border-radius:16px; padding:13px 10px; text-align:center; font-weight:800; font-size:19px; cursor:pointer; font-family:inherit; color:var(--ink);}
.match-item.selected{background:#e7f5ff; border-color:#3bc9db;}
.match-item.done{background:#f1f8ec; border-color:#8ce99a; color:#51cf66; cursor:default;}
.slide-board{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(100%,330px); margin:0 auto;}
.slide-cell{aspect-ratio:1; border-radius:18px; background:#f1e8ff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900; cursor:pointer; border:2px solid transparent;}
.slide-cell.empty{background:transparent; border-style:dashed; border-color:var(--line);}
.pattern-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; margin:18px 0;}
.pattern-tile{width:56px; height:56px; border-radius:18px; background:#fff; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900;}
.pattern-options{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px;}
.option-btn{font-family:inherit; min-width:64px; border:2px solid var(--line); background:#fff; border-radius:18px; padding:14px 16px; font-size:24px; font-weight:900; cursor:pointer; color:var(--ink);}
.guess-input{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0;}
.guess-input input{width:120px; border:2px solid var(--line); border-radius:16px; padding:12px 14px; font-size:20px; text-align:center; font-family:inherit; outline:none;}
.history-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px;}
.history-chip{background:#f6f1ff; border:1px solid var(--line); border-radius:12px; padding:6px 10px; font-size:14px; color:var(--ink2);}
@media(max-width:520px){ .wrap{padding:16px 12px 24px;} h1{font-size:28px;} .panel{padding:18px 14px;} }
</style>
</head>

<div class="wrap">
  <div class="topbar">

  </div>
  <h1>🎮 小游戏<span class="tw">乐园</span></h1>
  <div class="subtitle">先休息一下，玩几个轻松的益智小游戏吧～</div>

  <div class="game-grid" id="gameGrid">
    <button class="game-card c2048" data-game="g2048">
      <div class="icon">🔢</div>
      <h2>合成 2048</h2>
      <p>上下左右滑动，把相同数字合在一起，看看能不能合成 2048！</p>
      <div class="tags"><span class="tag">数字合成</span><span class="tag">益智</span><span class="tag">单人</span></div>

    <button class="game-card tic" data-game="tic">
      <div class="icon">⭕</div>
      <h2>井字棋</h2>
      <p>轮流下子，连成横、竖或斜的三个棋子就获胜。可以双人对战，也可以挑战电脑。</p>
      <div class="tags"><span class="tag">双人对战</span><span class="tag">人机模式</span><span class="tag">经典棋类</span></div>
    </button>
    <button class="game-card memo" data-game="memo">
      <div class="icon">🃏</div>
      <h2>记忆翻牌</h2>

      <div class="tags"><span class="tag">记忆力</span><span class="tag">观察力</span><span class="tag">单人</span></div>
    </button>

      <div class="icon">🔗</div>

      <div class="tags"><span class="tag">数学启蒙</span><span class="tag">配对</span><span class="tag">单人</span></div>
    </button>
    <button class="game-card slide" data-game="slide">
      <div class="icon">🧩</div>
      <h2>滑块拼图</h2>
      <p>移动数字滑块，把 1 到 8 按从小到大的顺序排好。</p>
      <div class="tags"><span class="tag">空间规划</span><span class="tag">顺序感</span><span class="tag">单人</span></div>
    </button>
    <button class="game-card pattern" data-game="pattern">
      <div class="icon">🌈</div>
      <h2>找规律</h2>

    </button>
    <button class="game-card guess" data-game="guess">
      <div class="icon">🎯</div>
      <h2>猜数字</h2>
      <p>电脑心里想了一个 1 到 100 的数字，根据“大了”“小了”的提示猜出来。</p>
      <div class="tags"><span class="tag">大小比较</span><span class="tag">推理</span><span class="tag">单人</span></div>
    </button>
  </div>

  <section class="panel" id="panel2048">
    <div class="panel-head">
      <h2>🔢 合成 2048</h2>
      <button class="btn secondary" id="backFrom2048">返回游戏</button>
    </div>
    <div class="score-row">
      <div class="score-box"><div class="label">当前分数</div><div class="num" id="score2048">0</div></div>
      <div class="score-box"><div class="label">最高方块</div><div class="num" id="bestTile">2</div></div>
    </div>
    <div class="status" id="status2048">滑动或按方向键移动方块</div>
    <div class="board-2048" id="board2048"></div>
    <div class="tip">手机上直接在棋盘上上下左右滑动；电脑上使用方向键。</div>
  </section>

  <section class="panel" id="panelTic">
    <div class="panel-head">
      <h2>⭕ 井字棋</h2>
      <button class="btn secondary" id="backFromTic">返回游戏</button>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="ai">🤖 挑战电脑</button>
      <button class="mode-btn" data-mode="pvp">👨‍👧 双人对战</button>
    </div>
    <div class="status" id="statusTic">轮到你下 X</div>

    <div style="text-align:center; margin-top:18px;"><button class="btn" id="restartTic">重新开始</button></div>
  </section>

  <section class="panel" id="panelMemo">
    <div class="panel-head">
      <h2>🃏 记忆翻牌</h2>
      <button class="btn secondary" id="backFromMemo">返回游戏</button>
    </div>
    <div class="score-row">
      <div class="score-box"><div class="label">步数</div><div class="num" id="memoMoves">0</div></div>
      <div class="score-box"><div class="label">已配对</div><div class="num" id="memoPairs">0/6</div></div>
    </div>
    <div class="status" id="memoStatus">翻两张相同的图案</div>
    <div class="mini-grid memo-grid" id="memoBoard"></div>
  </section>

  <section class="panel" id="panelMatch">
    <div class="panel-head">
      <h2>🔗 数字连连看</h2>
      <button class="btn secondary" id="backFromMatch">返回游戏</button>
    </div>
    <div class="status" id="matchStatus">先点左边数字，再点右边对应的圆点</div>
    <div class="match-cols">
      <div class="match-list" id="matchLeft"></div>
      <div class="match-list" id="matchRight"></div>
    </div>
  </section>

  <section class="panel" id="panelSlide">
    <div class="panel-head">
      <h2>🧩 滑块拼图</h2>
      <button class="btn secondary" id="backFromSlide">返回游戏</button>
    </div>
    <div class="status" id="slideStatus">把数字按 1～8 排好，空格在右下角</div>
    <div class="slide-board" id="slideBoard"></div>
    <div style="text-align:center; margin-top:18px;"><button class="btn" id="restartSlide">重新打乱</button></div>
  </section>

  <section class="panel" id="panelPattern">
    <div class="panel-head">
      <h2>🌈 找规律</h2>
      <button class="btn secondary" id="backFromPattern">返回游戏</button>
    </div>
    <div class="status" id="patternStatus">问号后面应该是哪一个？</div>

      <button class="btn" id="guessSubmit">猜一下</button>
    </div>
    <div class="history-row" id="guessHistory"></div>

</div>

<script>
(function(){
  var grid = document.getElementById('gameGrid');
  var panels = { g2048: document.getElementById('panel2048'), tic: document.getElementById('panelTic'), memo: document.getElementById('panelMemo'), match: document.getElementById('panelMatch'), slide: document.getElementById('panelSlide'), pattern: document.getElementById('panelPattern'), guess: document.getElementById('panelGuess') };
  function showPanel(name){
    grid.style.display = name ? 'none' : 'grid';
    Object.keys(panels).forEach(function(k){ panels[k].classList.toggle('show', k === name); });
  }
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.game-card');
    if(card) showPanel(card.dataset.game);
  });
  ['backFrom2048','backFromTic','backFromMemo','backFromMatch','backFromSlide','backFromPattern','backFromGuess'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(){ showPanel(''); });
  });

  function loadGameHigh(key, fallback){
    try { return Number(localStorage.getItem(key)) || fallback; } catch(e){ return fallback; }
  }
  function saveGameHigh(key, value){
    try { localStorage.setItem(key, String(value)); } catch(e){}
  }

  /* ---------- 2048 ---------- */
  var SIZE = 4, board = [], score = 0, bestTile = 2, over = false, won = false;
  var high2048 = loadGameHigh('bao_high_2048', 0);
  var boardEl = document.getElementById('board2048');
  var scoreEl = document.getElementById('score2048');
  var bestEl = document.getElementById('bestTile');
  var statusEl = document.getElementById('status2048');

  function emptyBoard(){ return Array.from({length:SIZE}, function(){ return Array(SIZE).fill(0); }); }
  function addRandom(){
    var empty = [];
    board.forEach(function(row, r){ row.forEach(function(v, c){ if(!v) empty.push([r,c]); }); });
    if(!empty.length) return;
    var pos = empty[Math.floor(Math.random()*empty.length)];
    board[pos[0]][pos[1]] = Math.random() < 0.9 ? 2 : 4;
  }
  function reset2048(){
    board = emptyBoard(); score = 0; bestTile = 2; over = false; won = false;
    addRandom(); addRandom(); render2048();
  }
  function slideLine(line){
    var arr = line.filter(Boolean), merged = [], gained = 0;
    for(var i=0;i<arr.length;i++){
      if(i+1 < arr.length && arr[i] === arr[i+1]){
        var v = arr[i]*2; merged.push(v); gained += v;
        if(v > bestTile) bestTile = v;
        i++;
      } else { merged.push(arr[i]); }
    }
    while(merged.length < SIZE) merged.push(0);
    return {line: merged, gained: gained};
  }
  function move(dir){
    if(over) return;
    var next = emptyBoard(), moved = false, gained = 0;
    for(var i=0;i<SIZE;i++){
      var line = [];
      for(var j=0;j<SIZE;j++){
        if(dir === 'left') line.push(board[i][j]);
        if(dir === 'right') line.push(board[i][SIZE-1-j]);
        if(dir === 'up') line.push(board[j][i]);
        if(dir === 'down') line.push(board[SIZE-1-j][i]);
      }
      var res = slideLine(line); gained += res.gained;
      for(var k=0;k<SIZE;k++){
        var val = res.line[k];
        if(dir === 'left') next[i][k] = val;
        if(dir === 'right') next[i][SIZE-1-k] = val;
        if(dir === 'up') next[k][i] = val;
        if(dir === 'down') next[SIZE-1-k][i] = val;
      }
    }
    for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++) if(board[r][c] !== next[r][c]) moved = true;
    if(!moved) return;
    board = next; score += gained; addRandom();
    if(!canMove()) over = true;
    if(bestTile >= 2048) won = true;
    render2048();
  }
  function canMove(){
    for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++){
      if(!board[r][c]) return true;
      if(c+1<SIZE && board[r][c] === board[r][c+1]) return true;
      if(r+1<SIZE && board[r][c] === board[r+1][c]) return true;
    }
    return false;
  }
  function render2048(){
    boardEl.innerHTML = '';
    board.forEach(function(row){ row.forEach(function(v){
      var cell = document.createElement('div');
      cell.className = 'cell' + (v ? ' v'+v : '');
      cell.textContent = v || '';
      boardEl.appendChild(cell);
    }); });
    if(score > high2048){ high2048 = score; saveGameHigh('bao_high_2048', high2048); }
    scoreEl.textContent = score; bestEl.textContent = bestTile;
    statusEl.textContent = over ? ('没有可移动的方块啦！历史最高分 ' + high2048) : won ? '太棒了，已经合成 2048！' : '滑动或按方向键移动方块';
  }
  document.addEventListener('keydown', function(e){
    if(!panels.g2048.classList.contains('show')) return;
    var map = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down'};
    if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
  });
  var touchStart = null;
  boardEl.addEventListener('touchstart', function(e){ touchStart = e.touches[0]; }, {passive:true});
  boardEl.addEventListener('touchend', function(e){
    if(!touchStart) return;
    var t = e.changedTouches[0], dx = t.clientX - touchStart.clientX, dy = t.clientY - touchStart.clientY;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, {passive:true});
  reset2048();

  /* ---------- 井字棋 ---------- */
  var tic = Array(9).fill(''), current = 'X', mode = 'ai', ticOver = false;
  var ticBoard = document.getElementById('ticBoard');
  var ticStatus = document.getElementById('statusTic');
  var wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function renderTic(){
    ticBoard.innerHTML = '';
    tic.forEach(function(v, i){
      var btn = document.createElement('button');
      btn.className = 'tic-cell' + (v ? '.' + v.toLowerCase() : '');
      btn.textContent = v || '';
      btn.addEventListener('click', function(){ placeTic(i); });
      ticBoard.appendChild(btn);
    });
    var line = winnerLine();
    if(line) line.forEach(function(i){ ticBoard.children[i].classList.add('win'); });
  }
  function placeTic(i){
    if(ticOver || tic[i]) return;
    tic[i] = current; renderTic();
    var win = winnerLine();
    if(win || tic.every(Boolean)){ finishTic(win); return; }
    current = current === 'X' ? 'O' : 'X';
    ticStatus.textContent = mode === 'ai' ? (current === 'O' ? '电脑思考中…' : '轮到你下 X') : ('轮到 ' + current);
    if(mode === 'ai' && current === 'O') setTimeout(aiMove, 260);
  }
  function winnerLine(){
    for(var i=0;i<wins.length;i++){
      var a=wins[i][0], b=wins[i][1], c=wins[i][2];
      if(tic[a] && tic[a] === tic[b] && tic[a] === tic[c]) return wins[i];
    }
    return null;
  }
  function finishTic(line){
    ticOver = true;
    if(line){
      var winner = tic[line[0]];
      ticStatus.textContent = mode === 'ai' && winner === 'O' ? '电脑赢啦，再来一局！' : winner + ' 获胜！🎉';
    } else { ticStatus.textContent = '平局，再试一次！'; }
  }
  function aiMove(){
    if(ticOver) return;
    var open = tic.map(function(v, i){ return v ? null : i; }).filter(function(v){ return v !== null; });
    var bestIndex = null, bestScore = -Infinity;
    open.forEach(function(i){
      var next = tic.slice(); next[i] = 'O';
      var score = minimaxState(next, 1, false);
      if(score > bestScore){ bestScore = score; bestIndex = i; }
    });
    if(bestIndex === null) return;
    var tied = open.filter(function(i){
      var next = tic.slice(); next[i] = 'O';
      return minimaxState(next, 1, false) === bestScore;
    });
    if(tied.indexOf(4) !== -1) bestIndex = 4;
    else {
      var corner = tied.find(function(i){ return [0,2,6,8].indexOf(i) !== -1; });
      if(corner !== undefined) bestIndex = corner;
    }
    placeTic(bestIndex);
  }
  function minimaxState(boardState, depth, isMax){
    var line = wins.find(function(w){
      var a=w[0], b=w[1], c=w[2];
      return boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c];
    });
    if(line) return boardState[line[0]] === 'O' ? 10 - depth : depth - 10;
    if(boardState.every(Boolean)) return 0;
    var scores = [];
    for(var i=0;i<9;i++){
      if(!boardState[i]){
        var next = boardState.slice(); next[i] = isMax ? 'O' : 'X';
        scores.push(minimaxState(next, depth+1, !isMax));
      }
    }
    return isMax ? Math.max.apply(null, scores) : Math.min.apply(null, scores);
  }
  function resetTic(){
    tic = Array(9).fill(''); current = 'X'; ticOver = false;
    ticStatus.textContent = mode === 'ai' ? '轮到你下 X' : '轮到 X';
    renderTic();
  }
  document.querySelectorAll('.mode-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active'); mode = btn.dataset.mode; resetTic();
    });
  });
  document.getElementById('restartTic').addEventListener('click', resetTic);
  renderTic();

  /* ---------- 记忆翻牌 ---------- */
  var memoIcons = ['🍎','⭐','🐰','🚗','🌈','⚽'];
  var memoDeck = [], memoOpen = [], memoMatched = 0, memoMoves = 0, memoLock = false;
  var memoBest = loadGameHigh('bao_best_memo', 0) || null;
  var memoBoard = document.getElementById('memoBoard');
  var memoStatus = document.getElementById('memoStatus');
  var memoMovesEl = document.getElementById('memoMoves');
  var memoPairsEl = document.getElementById('memoPairs');
  function shuffle(arr){ return arr.slice().sort(function(){ return Math.random() - 0.5; }); }
  function resetMemo(){
    memoDeck = shuffle(memoIcons.concat(memoIcons));
    memoOpen = []; memoMatched = 0; memoMoves = 0; memoLock = false;
    renderMemo();
  }
  function renderMemo(){
    memoBest = loadGameHigh('bao_best_memo', 0) || null;
    memoBoard.innerHTML = '';
    memoDeck.forEach(function(icon, i){
      var btn = document.createElement('button');
      btn.className = 'memo-card';
      btn.textContent = icon;
      btn.addEventListener('click', function(){ flipMemo(i, btn); });
      memoBoard.appendChild(btn);
    });
    memoMovesEl.textContent = memoMoves;
    memoPairsEl.textContent = memoMatched + '/6';
    memoStatus.textContent = memoMatched === 6
      ? ('🎉 全部配对成功！' + (memoBest ? ' 最少 ' + memoBest + ' 步' : ''))
      : '翻两张相同的图案';
  }
  function flipMemo(i, btn){
    if(memoLock || btn.classList.contains('open') || btn.classList.contains('matched')) return;
    btn.classList.add('open'); memoOpen.push({i:i, btn:btn});
    if(memoOpen.length === 2){
      memoMoves += 1; memoMovesEl.textContent = memoMoves;
      var a = memoOpen[0], b = memoOpen[1];
      if(memoDeck[a.i] === memoDeck[b.i]){
        a.btn.classList.add('matched'); b.btn.classList.add('matched');
        memoMatched += 1; memoPairsEl.textContent = memoMatched + '/6';
        memoOpen = [];
        if(memoMatched === 6){
          if(!memoBest || memoMoves < memoBest){ memoBest = memoMoves; saveGameHigh('bao_best_memo', memoBest); }
          memoStatus.textContent = '🎉 全部配对成功！最少 ' + memoBest + ' 步';
        }
      } else {
        memoLock = true;
        setTimeout(function(){
          a.btn.classList.remove('open'); b.btn.classList.remove('open');
          memoOpen = []; memoLock = false;
        }, 650);
      }
    }
  }
  resetMemo();

  /* ---------- 数字连连看 ---------- */
  var matchPairs = [1,2,3,4,5,6];
  var matchLeftSel = null, matchDone = [];
  var matchLeftEl = document.getElementById('matchLeft');
  var matchRightEl = document.getElementById('matchRight');
  var matchStatus = document.getElementById('matchStatus');
  function renderMatch(){
    matchLeftEl.innerHTML = ''; matchRightEl.innerHTML = ''; matchDone = []; matchLeftSel = null;
    shuffle(matchPairs).forEach(function(n){
      var btn = document.createElement('button');
      btn.className = 'match-item'; btn.textContent = n; btn.dataset.value = n;
      btn.addEventListener('click', function(){ matchLeftSel = btn; highlightMatch(btn, matchLeftEl); });
      matchLeftEl.appendChild(btn);
    });
    shuffle(matchPairs).forEach(function(n){
      var btn = document.createElement('button');
      btn.className = 'match-item'; btn.textContent = '●'.repeat(n); btn.dataset.value = n;
      btn.addEventListener('click', function(){ matchRightClick(btn); });
      matchRightEl.appendChild(btn);
    });
    matchStatus.textContent = '先点左边数字，再点右边对应的圆点';
  }
  function highlightMatch(btn, list){
    list.querySelectorAll('.match-item').forEach(function(b){ b.classList.remove('selected'); });
    btn.classList.add('selected');
  }
  function matchRightClick(btn){
    if(!matchLeftSel || btn.classList.contains('done')) return;
    if(matchLeftSel.dataset.value === btn.dataset.value){
      matchLeftSel.classList.remove('selected'); matchLeftSel.classList.add('done'); btn.classList.add('done');
      matchDone.push(Number(btn.dataset.value)); matchLeftSel = null;
      matchStatus.textContent = matchDone.length === matchPairs.length ? '🎉 全部配对成功！' : '配对正确，继续下一组';
    } else {
      matchStatus.textContent = '再想一想，圆点数量要和数字一样哦';
    }
  }
  renderMatch();

  /* ---------- 滑块拼图 ---------- */
  var slideOrder = [], slideEmpty = 8, slideWon = false;
  var slideBoard = document.getElementById('slideBoard');
  var slideStatus = document.getElementById('slideStatus');
  function resetSlide(){
    do { slideOrder = shuffle([1,2,3,4,5,6,7,8,0]); } while(isSlideSolved());
    slideEmpty = slideOrder.indexOf(0); slideWon = false; renderSlide();
  }
  function isSlideSolved(){
    for(var i=0;i<8;i++) if(slideOrder[i] !== i+1) return false;
    return slideOrder[8] === 0;
  }
  function renderSlide(){
    slideBoard.innerHTML = '';
    slideOrder.forEach(function(v, i){
      var btn = document.createElement('button');
      btn.className = 'slide-cell' + (v ? '' : ' empty');
      btn.textContent = v || '';
      btn.addEventListener('click', function(){ moveSlide(i); });
      slideBoard.appendChild(btn);
    });
    slideStatus.textContent = slideWon ? '🎉 排好啦，真聪明！' : '把数字按 1～8 排好，空格在右下角';
  }
  function moveSlide(i){
    if(slideWon) return;
    var row = Math.floor(i/3), col = i%3, er = Math.floor(slideEmpty/3), ec = slideEmpty%3;
    if(Math.abs(row-er) + Math.abs(col-ec) !== 1) return;
    slideOrder[slideEmpty] = slideOrder[i]; slideOrder[i] = 0; slideEmpty = i;
    if(isSlideSolved()) slideWon = true;
    renderSlide();
  }
  document.getElementById('restartSlide').addEventListener('click', resetSlide);
  resetSlide();

  /* ---------- 找规律 ---------- */
  var patternSets = [
    {seq:['🔴','🟡','🔴','🟡'], options:['🔴','🟡','🟢'], answer:0},
    {seq:['⭐','⭐','🌙','⭐','⭐'], options:['🌙','⭐','☀️'], answer:0},
    {seq:['🚗','🚕','🚗','🚕'], options:['🚕','🚗','🚙'], answer:0},
    {seq:['1','2','3','4'], options:['5','3','6'], answer:0},
    {seq:['🔵','🔵','🔴','🔵','🔵'], options:['🔴','🔵','🟢'], answer:0}
  ];
  var patternIndex = 0;
  var patternRow = document.getElementById('patternRow');
  var patternOptions = document.getElementById('patternOptions');
  var patternStatus = document.getElementById('patternStatus');
  function renderPattern(){
    var set = patternSets[patternIndex];
    patternRow.innerHTML = '';
    set.seq.forEach(function(v){
      var tile = document.createElement('div'); tile.className = 'pattern-tile'; tile.textContent = v; patternRow.appendChild(tile);
    });
    var q = document.createElement('div'); q.className = 'pattern-tile'; q.textContent = '?'; patternRow.appendChild(q);
    patternOptions.innerHTML = '';
    set.options.forEach(function(v, i){
      var btn = document.createElement('button'); btn.className = 'option-btn'; btn.textContent = v;
      btn.addEventListener('click', function(){ checkPattern(i); });
      patternOptions.appendChild(btn);
    });
    patternStatus.textContent = '问号后面应该是哪一个？';
  }
  function checkPattern(i){
    var set = patternSets[patternIndex];
    if(i === set.answer){
      patternStatus.textContent = '✅ 答对了！';
      patternIndex = (patternIndex + 1) % patternSets.length;
      setTimeout(renderPattern, 700);
    } else {
      patternStatus.textContent = '再观察一下前面的排列规律哦';
    }
  }
  renderPattern();

  /* ---------- 猜数字 ---------- */
  var guessAnswer = Math.floor(Math.random()*100)+1, guessTries = 0;
  var guessInput = document.getElementById('guessInput');
  var guessStatus = document.getElementById('guessStatus');
  var guessHistory = document.getElementById('guessHistory');
  function resetGuess(){
    guessAnswer = Math.floor(Math.random()*100)+1; guessTries = 0;
    guessHistory.innerHTML = ''; guessInput.value = '';
    guessStatus.textContent = '我想好了一个 1～100 的数字，你来猜吧！';
  }
  function submitGuess(){
    var v = Number(guessInput.value);
    if(!v || v < 1 || v > 100){ guessStatus.textContent = '请输入 1 到 100 之间的数字'; return; }
    guessTries += 1;
    var chip = document.createElement('span'); chip.className = 'history-chip';
    if(v === guessAnswer){
      chip.textContent = v + ' ✅'; guessStatus.textContent = '🎉 猜对了！共用了 ' + guessTries + ' 次';
      guessHistory.appendChild(chip); setTimeout(resetGuess, 1200); return;
    }
    var hint = v > guessAnswer ? '大了' : '小了';
    chip.textContent = v + ' · ' + hint; guessHistory.appendChild(chip);
    guessStatus.textContent = hint + '，再猜一次！'; guessInput.value = ''; guessInput.focus();
  }
  document.getElementById('guessSubmit').addEventListener('click', submitGuess);
  guessInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') submitGuess(); });
})();
</script>
</body>
