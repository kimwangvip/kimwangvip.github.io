<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>成语学习 · 每日一成语</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffd43b'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%235b4636' font-family='sans-serif' font-weight='bold'%3E成%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg1:#c8ecff; --bg2:#fff7e6;
    --ink:#5b4636; --ink2:#8a7a66;
    --accent:#ff9f1a; --accent2:#ffd166;
    --cream:#fff8e7; --line:#e8dcc8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; overflow-x: hidden;}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #d9f3ff 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, #e9f7ff 45%, var(--bg2) 100%);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
    padding-bottom:40px;
  }
  .deco{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .deco .blob{position:absolute; border-radius:50%; filter:blur(40px); opacity:.5;}
  .deco .b1{width:260px; height:260px; background:#ffe08a; top:-60px; left:-80px;}
  .deco .b2{width:320px; height:320px; background:#a9e6c0; bottom:-100px; right:-100px;}
  .deco .b3{width:200px; height:200px; background:#bcdcff; top:40%; right:-60px;}

  .wrap{position:relative; z-index:1; max-width:720px; margin:0 auto; padding:24px 16px 40px; text-align:center;}

  h1.title{
    font-size:40px; margin:0 0 4px; color:#fff; letter-spacing:2px; font-weight: 800;
    text-shadow:0 3px 0 rgba(0,0,0,.10), 0 6px 14px rgba(255,140,80,.30);
  }
  h1.title .tw{color:var(--accent2);}
  .subtitle{font-size:15px; color:var(--ink2); margin-bottom:22px;}

  /* 搜索栏 */
  .searchbar{
    display:flex; gap:8px; align-items:center; max-width:520px; margin:0 auto 14px;
    background:#fff; border-radius:16px; padding:8px 8px 8px 18px;
    box-shadow:0 8px 22px rgba(90,60,40,.12); border:2px solid #fff;
  }
  .searchbar input{
    flex:1; font-family:inherit; font-size:17px; color:var(--ink);
    border:none; outline:none; background:transparent; padding:8px 0;
  }
  .searchbar input::placeholder{color:#c9b89a;}
  .searchbar button{
    font-family:inherit; font-size:15px; color:#fff; cursor:pointer; border:none;
    border-radius:12px; padding:10px 18px;
    background:linear-gradient(180deg,#ffd166,#ff9f1a);
    box-shadow:0 3px 0 #d97e00; transition:transform .1s; font-weight: 600;
  }
  .searchbar button:active{transform:translateY(2px); box-shadow:0 1px 0 #d97e00;}

  /* 独立随机按钮 */
  .random-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit; font-size: 17px; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #4dabf7, #2f8fe0);
    border: none; border-radius: 30px; padding: 12px 30px;
    box-shadow: 0 4px 0 #1c7ed6, 0 8px 20px rgba(47,143,224,.3);
    transition: transform .1s, box-shadow .1s; margin: 0 auto 18px; width: 100%; max-width: 520px;
  }
  .random-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c7ed6; }

  /* 筛选分组 */
  .filter-group{
    max-width:620px; margin:0 auto 14px;
    background:rgba(255,255,255,.65);
    border:2px solid #fff; border-radius:18px;
    padding:12px 14px 10px;
    box-shadow:0 6px 18px rgba(90,60,40,.08);
  }
  .filter-group .group-title{
    font-size:13px; color:var(--ink2); text-align:left;
    margin-bottom:8px; padding-left:4px;
    font-weight:600; letter-spacing:1px;
    display:flex; align-items:center; gap:6px;
  }
  .filter-group .group-title .clear-one{
    margin-left:auto; font-size:12px; color:#c9b89a;
    cursor:pointer; font-weight:400; padding:2px 6px; border-radius:8px;
    transition:all .15s;
  }
  .filter-group .group-title .clear-one:hover{color:#ff6b6b; background:#ffe3e3;}
  .filter-group .group-title .clear-one.hide{display:none;}

  .filters{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-start;
  }
  .filter-chip{
    font-family:inherit; font-size:14px; color:var(--ink2); cursor:pointer;
    background:#fff; border:2px solid var(--line); border-radius:20px;
    padding:6px 14px; transition:all .15s; font-weight: 500;
  }
  .filter-chip:hover{border-color:var(--accent2); background:#fff8e7;}
  .filter-chip.active{
    color:#fff; border-color:#ffb347;
    background:linear-gradient(180deg,#ffd166,#ff9f1a);
    box-shadow:0 3px 8px rgba(255,159,26,.3);
  }
  .filter-chip.len.active{
    border-color:#38d9a9;
    background:linear-gradient(180deg,#63e6be,#20c997);
    box-shadow:0 3px 8px rgba(32,201,151,.3);
  }
  .filter-chip.len:hover{border-color:#63e6be; background:#e6fcf5;}

  /* 详情卡片 */
  .card{
    background:#fff; border-radius:26px; padding:26px 24px 22px;
    max-width:560px; margin:0 auto 20px; text-align:center;
    box-shadow:0 14px 40px rgba(90,60,40,.14);
    border:2px solid #fff; position:relative; overflow:hidden;
    transition:transform .18s ease;
    word-break: break-word;
  }
  .card:hover{transform:translateY(-2px);}
  .card::before{
    content:''; position:absolute; top:-50%; right:-20%;
    width:180px; height:180px;
    background:radial-gradient(circle, rgba(255,224,138,.5), transparent 70%);
    border-radius:50%; pointer-events:none;
  }
  .card .idx{
    position:absolute; top:16px; left:20px; font-size:13px; color:#c9b89a;
    cursor: pointer;
  }
  .card .idx:hover{ color: var(--accent); }
  .card .tag{
    position:absolute; top:14px; right:20px;
    font-size:12px; color:#fff; background:linear-gradient(180deg,#ffb347,#ff8c1a);
    border-radius:14px; padding:3px 10px; font-weight: 600;
    box-shadow:0 2px 6px rgba(255,140,26,.3);
  }
  .card .word{
    font-size:52px; color:var(--ink); letter-spacing:4px; line-height:1.2;
    margin:12px 0 8px; font-weight:800;
    text-shadow:0 2px 0 rgba(255,220,160,.4);
    cursor: pointer;
  }
  .card .word:active{ transform: scale(0.98); }

  .card .pinyin-wrap {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 16px;
  }
  .card .pinyin{
    font-size:16px; color:var(--accent); letter-spacing:2px; font-weight: 500;
  }

  /* 语音按钮 */
  .speak-btn {
    background: #fff3cd; border: 1px solid #ffe08a; border-radius: 50%;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s; color: #d97706; font-size: 14px;
    padding: 0;
  }
  .speak-btn:hover { background: #ffe08a; transform: scale(1.1); }
  .speak-btn:active { transform: scale(0.95); }

  .card .meta{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .meta-badge{
    font-size:13px; color:var(--ink2); background:#fff8e7;
    border:1.5px solid var(--line); border-radius:12px; padding:4px 12px;
    font-weight: 500;
  }
  .meta-badge b{color:var(--accent);}
  .meta-badge.len-badge{background:#e6fcf5; border-color:#b2f2c9; color:#0ca678;}
  .meta-badge.len-badge b{color:#0ca678;}

  .section{
    text-align:left; background:var(--cream); border-radius:16px;
    padding:14px 16px; margin-top:12px; border:1.5px solid #ffe9b0;
  }
  .section .label{
    font-size:13px; color:var(--accent); margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
    font-weight:600; letter-spacing:1px;
  }
  .section .content{
    font-size:15.5px; color:#5b4636; line-height:1.7;
  }
  .section .content.quote{color:#7a5a3a;}
  .section.hide{display:none;}

  .card-actions{
    display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center;
  }
  .btn{
    font-family:inherit; font-size:16px; font-weight: 600; color:#fff; cursor:pointer; border:none;
    border-radius:40px; padding:12px 22px; letter-spacing:1px;
    box-shadow:0 4px 0 rgba(0,0,0,.14), 0 8px 16px rgba(0,0,0,.08);
    transition:transform .1s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.14);}
  .btn-random{background:linear-gradient(180deg,#4dabf7,#2f8fe0);}
  .btn-toggle{background:linear-gradient(180deg,#b197fc,#8f6ce8);}
  .btn-back{background:#fff; color:var(--ink2); border:2px solid var(--line); box-shadow:0 4px 0 var(--line);}
  .btn-back:active{box-shadow:0 1px 0 var(--line);}

  /* 结果列表 */
  .result-info{
    font-size:14px; color:var(--ink2); margin-bottom:14px;
  }
  .result-list{
    display:grid; 
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px; max-width:680px; margin:0 auto;
    align-items: start;
  }
  .result-item{
    background:#fff; border:2px solid var(--line); border-radius:16px;
    padding:14px 16px; cursor:pointer; transition:all .15s;
    text-align:left; font-family:inherit;
    display:flex; flex-direction:column; gap:5px;
    position:relative; 
    width: 100%;
    min-width: 0;
    overflow: hidden;
  }
  .result-item:hover{border-color:var(--accent2); background:#fff8e7; transform:translateY(-2px); box-shadow:0 6px 16px rgba(255,180,80,.2);}
  
  .result-item .w{
    font-size:20px; color:var(--ink); font-weight:700; letter-spacing:1px; line-height: 1.3;
    word-break: break-word; overflow-wrap: anywhere;
  }
  .result-item .p{
    font-size:12px; color:var(--accent); font-weight: 500; line-height: 1.4;
    word-break: break-word; overflow-wrap: anywhere;
  }
  .result-item .e{
    font-size:13px; color:var(--ink2); margin-top:4px;
    line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; text-overflow: ellipsis; 
    word-break: break-word;
  }

  /* 加载/空状态 */
  .loading, .empty{
    padding:40px 20px; color:#b0a08d; font-size:16px;
  }
  .loading::before{
    content:''; display:inline-block; width:18px; height:18px;
    border:3px solid #ffd166; border-top-color:transparent; border-radius:50%;
    animation:spin .8s linear infinite; margin-right:10px; vertical-align:-3px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 分页 */
  .pager{
    display: flex; justify-content: center; align-items: center; gap: 12px;
    margin-top: 24px;
  }
  .pager button{
    background: #fff; border: 2px solid var(--line); border-radius: 10px;
    padding: 8px 16px; font-size: 14px; color: var(--ink2); cursor: pointer;
    transition: all .15s; font-weight: 600;
  }
  .pager button:not(:disabled):hover{ border-color: var(--accent); color: var(--accent); }
  .pager button:disabled{ opacity: .4; cursor: not-allowed; }
  .pager span{ font-size: 14px; color: var(--ink2); font-weight: 500; }

  /* Toast */
  .toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(60,40,20,.92); color:#fff; font-size:15px;
    border-radius:24px; padding:12px 24px; opacity:0; transition:all .3s;
    z-index:100; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* 手机端专项优化 */
  @media (max-width: 600px){
    h1.title{font-size:32px;}
    .card .word{font-size:36px; letter-spacing: 2px;}
    .card .pinyin{font-size: 14px;}
    .card{padding:22px 16px 18px;}
    .searchbar{padding-left:14px;}
    .searchbar button{padding:10px 14px; font-size:14px;}
    .filter-group{padding:10px 10px 8px;}
    .filter-chip{font-size:13px; padding:5px 11px;}
    
    .result-list { 
      grid-template-columns: 1fr; 
      gap: 12px; 
    }
    .result-item { 
      padding: 16px; 
    }
  }
</style>
</head>
<body>

<div class="deco">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="wrap">
  <h1 class="title">成语<span class="tw">学习</span></h1>
  <div class="subtitle">搜一搜、学一学，每天积累一点点</div>

  <!-- 搜索 -->
  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="输入成语、拼音首字母或关键词…" autocomplete="off">
    <button id="searchBtn">搜索</button>
  </div>

  <!-- 独立大随机按钮 -->
  <button class="random-btn" id="randomBtn">🎲 随便看一个</button>

  <!-- 拼音首字母筛选 -->
  <div class="filter-group">
    <div class="group-title">
      <span>🔤 拼音首字母</span>
      <span class="clear-one hide" id="clearLetter">清除</span>
    </div>
    <div class="filters" id="letterFilters">
      <button class="filter-chip active" data-mode="all">📚 全部</button>
      <button class="filter-chip" data-mode="a">A</button>
      <button class="filter-chip" data-mode="b">B</button>
      <button class="filter-chip" data-mode="c">C</button>
      <button class="filter-chip" data-mode="d">D</button>
      <button class="filter-chip" data-mode="e">E</button>
      <button class="filter-chip" data-mode="f">F</button>
      <button class="filter-chip" data-mode="g">G</button>
      <button class="filter-chip" data-mode="h">H</button>
      <button class="filter-chip" data-mode="j">J</button>
      <button class="filter-chip" data-mode="k">K</button>
      <button class="filter-chip" data-mode="l">L</button>
      <button class="filter-chip" data-mode="m">M</button>
      <button class="filter-chip" data-mode="n">N</button>
      <button class="filter-chip" data-mode="p">P</button>
      <button class="filter-chip" data-mode="q">Q</button>
      <button class="filter-chip" data-mode="r">R</button>
      <button class="filter-chip" data-mode="s">S</button>
      <button class="filter-chip" data-mode="t">T</button>
      <button class="filter-chip" data-mode="w">W</button>
      <button class="filter-chip" data-mode="x">X</button>
      <button class="filter-chip" data-mode="y">Y</button>
      <button class="filter-chip" data-mode="z">Z</button>
    </div>
  </div>

  <!-- 字数筛选 -->
  <div class="filter-group">
    <div class="group-title">
      <span>📏 按字数</span>
      <span class="clear-one hide" id="clearLen">清除</span>
    </div>
    <div class="filters" id="lenFilters">
      <button class="filter-chip len active" data-len="">不限</button>
      <button class="filter-chip len" data-len="3">3 字</button>
      <button class="filter-chip len" data-len="4">4 字</button>
      <button class="filter-chip len" data-len="5">5 字</button>
      <button class="filter-chip len" data-len="6">6 字</button>
      <button class="filter-chip len" data-len="7">7 字</button>
      <button class="filter-chip len" data-len="8">8 字</button>
      <button class="filter-chip len" data-len="9">9 字</button>
      <button class="filter-chip len" data-len="10+">10 字及以上</button>
    </div>
  </div>

  <!-- 主区域 -->
  <div id="mainArea">
    <div class="loading">正在加载成语…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';

  var SUPABASE_URL = 'https://oykyjwiwukidpchbbnnf.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_bwUO6RQBa1qiurFdMbNX3A_nTtHTMEt';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var PAGE_SIZE = 24;

  var state = {
    mode: 'all',
    letter: '',
    len: '',
    keyword: '',
    list: [],
    index: 0,
    total: 0,
    page: 0,
    loading: false,
    currentIdiom: null,
    ready: false,
    isRandomView: false
  };

  var els = {
    input: document.getElementById('searchInput'),
    searchBtn: document.getElementById('searchBtn'),
    randomBtn: document.getElementById('randomBtn'),
    letterFilters: document.getElementById('letterFilters'),
    lenFilters: document.getElementById('lenFilters'),
    main: document.getElementById('mainArea'),
    toast: document.getElementById('toast'),
    clearLetter: document.getElementById('clearLetter'),
    clearLen: document.getElementById('clearLen')
  };

  function escapeHtml(s){
    if(s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function wordLen(w){
    if(!w) return 0;
    var s = String(w).replace(/[^\u4e00-\u9fa5]/g, '');
    return Array.from(s).length;
  }

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ els.toast.classList.remove('show'); }, 2000);
  }

  function setLoading(html){ els.main.innerHTML = '<div class="loading">' + html + '</div>'; }
  function setEmpty(msg){ els.main.innerHTML = '<div class="empty">' + msg + '</div>'; }
  function setLoggedOut(){ els.main.innerHTML = '<div class="empty" style="line-height:2;">请先登录后再学习成语<br><a href="index.html" style="color:#ff9f1a;text-decoration:underline;">去登录</a></div>'; }

  // 语音朗读
  function speakText(text, lang) {
    if (!('speechSynthesis' in window)) {
      showToast('您的浏览器不支持语音朗读功能');
      return;
    }
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance(text);
    msg.lang = lang || 'zh-CN';
    msg.rate = 0.85;
    var voices = window.speechSynthesis.getVoices();
    var zhVoice = voices.find(function(v) { return v.lang.indexOf('zh') === 0; });
    if (zhVoice) msg.voice = zhVoice;
    window.speechSynthesis.speak(msg);
  }

  function buildQuery(){
    var q = sb.from('idioms').select('*', { count: 'exact' });
    if(state.keyword){
      var kw = state.keyword.trim();
      q = q.or('word.ilike.%' + kw + '%,pinyin.ilike.%' + kw + '%,abbreviation.ilike.%' + kw + '%,explanation.ilike.%' + kw + '%');
    } else if(state.mode === 'letter' && state.letter){
      q = q.ilike('abbreviation', state.letter + '%');
    }
    if(state.len){
      if(state.len === '10+') q = q.gte('word_len', 10);
      else q = q.eq('word_len', parseInt(state.len));
    }
    q = q.order('word', { ascending: true });
    return q;
  }

  async function queryList(page) {
    if(!state.ready){ setLoggedOut(); return; }
    state.loading = true;
    state.isRandomView = false;

    state.page = page || 0;
    var from = state.page * PAGE_SIZE;
    var to = from + PAGE_SIZE - 1;
    var q = buildQuery();
    var res = await q.range(from, to);
    state.loading = false;
    if(res.error){ setEmpty('加载失败：' + escapeHtml(res.error.message)); return; }
    state.list = res.data || []; state.total = res.count || 0; state.index = 0;
    renderList();
  }

  async function fetchRandomIdiom() {
    if(!state.ready) return;
    setLoading('正在抽取随机成语…');
    var countRes = await sb.from('idioms').select('*', { count: 'exact', head: true });
    var total = countRes.count || 0;
    if(total === 0){ setEmpty('成语库是空的，先去导入数据吧～'); return; }
    var offset = Math.floor(Math.random() * total);
    var { data, error } = await sb.from('idioms').select('*').range(offset, offset);
    if(error || !data || !data.length){ setEmpty('加载失败，请重试'); return; }
    state.list = data;
    state.index = 0;
    state.isRandomView = true;
    renderCard();
  }

  function renderCard(){
    if(!state.list.length){ setEmpty('没有找到成语，换个筛选条件试试～'); return; }
    var idiom = state.list[state.index];
    state.currentIdiom = idiom;
    var derivation = (idiom.derivation || '').trim();
    var example = (idiom.example || '').trim();
    var explanation = (idiom.explanation || '').trim();
    var hasExample = example && example !== '无';
    var len = wordLen(idiom.word);

    var topLeftHtml = '';
    var actionsHtml = '';

    if(state.isRandomView){
      topLeftHtml = '<div class="idx" style="cursor:default;">随机推荐</div>';
      actionsHtml = '<button class="btn btn-random" id="btnRandomInCard">🎲 再抽一个</button>';
    } else {
      topLeftHtml = '<div class="idx" id="btnBackList">⬅️ 返回列表</div>';
      var prevDisabled = state.index === 0 ? 'disabled' : '';
      var nextDisabled = state.index >= state.list.length - 1 ? 'disabled' : '';
      actionsHtml = '<button class="btn btn-back" id="btnPrev" ' + prevDisabled + '>👈 上一个</button>' +
                    '<button class="btn btn-back" id="btnNext" ' + nextDisabled + '>下一个 👉</button>';
    }

    var html =
      '<div class="card">' +
        topLeftHtml + 
        '<div class="tag">成语</div>' +
        '<div class="word" id="speakWord">' + escapeHtml(idiom.word || '') + '</div>' +
        '<div class="pinyin-wrap">' +
          '<div class="pinyin">' + escapeHtml(idiom.pinyin || '') + '</div>' +
          '<button class="speak-btn" id="speakPinyin" title="朗读拼音">🔊</button>' +
        '</div>' +
        '<div class="meta">' +
          '<span class="meta-badge len-badge">共 <b>' + len + '</b> 字</span>' +
          /* 直接渲染数据库返回的 abbreviation 字段，不做任何前端计算加工 */
          (idiom.abbreviation ? '<span class="meta-badge">首字母 <b>' + escapeHtml(idiom.abbreviation) + '</b></span>' : '') +
        '</div>' +
        (explanation ? '<div class="section"><div class="label">📖 释义</div><div class="content">' + escapeHtml(explanation) + '</div></div>' : '') +
        (derivation ? '<div class="section"><div class="label">📜 出处</div><div class="content quote">' + escapeHtml(derivation) + '</div></div>' : '') +
        (hasExample ? '<div class="section"><div class="label">✏️ 例句</div><div class="content quote">' + escapeHtml(example) + '</div></div>' : '') +
        '<div class="card-actions">' +
          actionsHtml +
          '<button class="btn btn-toggle" id="btnToggle">👀 收起释义</button>' +
        '</div></div>';

    els.main.innerHTML = html;
    var card = els.main.querySelector('.card');
    var toggleBtn = document.getElementById('btnToggle');
    var sections = card.querySelectorAll('.section');
    var expanded = true;
    
    toggleBtn.addEventListener('click', function(){
      expanded = !expanded;
      sections.forEach(function(s){ s.classList.toggle('hide', !expanded); });
      toggleBtn.textContent = expanded ? '👀 收起释义' : '👀 展开释义';
    });

    document.getElementById('speakWord').addEventListener('click', function() {
      speakText(idiom.word, 'zh-CN');
    });
    document.getElementById('speakPinyin').addEventListener('click', function() {
      speakText(idiom.pinyin, 'zh-CN');
    });

    if(state.isRandomView){
      document.getElementById('btnRandomInCard').addEventListener('click', fetchRandomIdiom);
    } else {
      document.getElementById('btnBackList').addEventListener('click', function(){ renderList(); });
      var prevBtn = document.getElementById('btnPrev');
      var nextBtn = document.getElementById('btnNext');
      if(prevBtn) prevBtn.addEventListener('click', function(){ state.index--; renderCard(); });
      if(nextBtn) nextBtn.addEventListener('click', function(){ state.index++; renderCard(); });
    }
  }

  function renderList(){
    state.isRandomView = false;
    if(!state.list.length){ setEmpty('没有找到成语，换个筛选条件试试～'); return; }
    var infoParts = [];
    if(state.keyword) infoParts.push('关键词「' + escapeHtml(state.keyword) + '」');
    if(state.mode === 'letter' && state.letter) infoParts.push('首字母 ' + state.letter.toUpperCase());
    if(state.len) infoParts.push(state.len === '10+' ? '10 字及以上' : (state.len + ' 字'));
    var condText = infoParts.length ? ('（' + infoParts.join(' · ') + '）') : '';
    var totalPages = Math.ceil(state.total / PAGE_SIZE);
    var info = '共 ' + state.total + ' 条' + condText + '，当前第 ' + (state.page + 1) + ' / ' + (totalPages || 1) + ' 页';

    var items = state.list.map(function(it, i){
      return '<button class="result-item" data-i="' + i + '">' +
        '<span class="w">' + escapeHtml(it.word || '') + '</span>' +
        '<span class="p">' + escapeHtml(it.pinyin || '') + '</span>' +
        '<span class="e">' + escapeHtml(it.explanation || '') + '</span>' +
      '</button>';
    }).join('');

    var pagerHtml = '';
    if(totalPages > 1){
      pagerHtml = '<div class="pager">' +
        '<button id="prevPage" ' + (state.page === 0 ? 'disabled' : '') + '>上一页</button>' +
        '<span>' + (state.page + 1) + ' / ' + totalPages + '</span>' +
        '<button id="nextPage" ' + (state.page >= totalPages - 1 ? 'disabled' : '') + '>下一页</button>' +
      '</div>';
    }

    els.main.innerHTML = '<div class="result-info">' + info + '</div><div class="result-list">' + items + '</div>' + pagerHtml;
    els.main.querySelectorAll('.result-item').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.dataset.i);
        state.index = i; renderCard();
      });
    });
    if(document.getElementById('prevPage')) document.getElementById('prevPage').onclick = function(){ queryList(state.page - 1); window.scrollTo({top:0, behavior:'smooth'}); };
    if(document.getElementById('nextPage')) document.getElementById('nextPage').onclick = function(){ queryList(state.page + 1); window.scrollTo({top:0, behavior:'smooth'}); };
  }

  function doSearch(){
    var kw = (els.input.value || '').trim();
    if(!kw){ showToast('请输入要搜索的内容'); return; }
    state.keyword = kw; state.mode = 'all'; setLetterActive(null, false); queryList(0);
  }

  function setLetterActive(el, clearKeyword){
    els.letterFilters.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
    if(el) el.classList.add('active');
    if(clearKeyword){ state.keyword = ''; els.input.value = ''; }
    var activeLetter = el && el.dataset.mode !== 'all';
    els.clearLetter.classList.toggle('hide', !activeLetter);
  }

  function setLenActive(len){
    els.lenFilters.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.len === len); });
    els.clearLen.classList.toggle('hide', !len);
  }

  els.randomBtn.addEventListener('click', fetchRandomIdiom);

  els.letterFilters.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-chip'); if(!btn) return;
    var mode = btn.dataset.mode; state.keyword = ''; els.input.value = '';
    if(mode === 'all'){ state.mode = 'all'; state.letter = ''; setLetterActive(btn, true); }
    else { state.mode = 'letter'; state.letter = mode; setLetterActive(btn, true); }
    setLoading('正在加载…'); queryList(0);
  });

  els.clearLetter.addEventListener('click', function(){
    state.mode = 'all'; state.letter = ''; state.keyword = ''; els.input.value = '';
    var allBtn = els.letterFilters.querySelector('[data-mode="all"]'); setLetterActive(allBtn, false);
    setLoading('正在加载…'); queryList(0);
  });

  els.lenFilters.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-chip'); if(!btn) return;
    var len = btn.dataset.len || '';
    if(len && state.len === len){ state.len = ''; setLenActive(''); }
    else { state.len = len; setLenActive(len); }
    setLoading('正在加载…'); queryList(0);
  });

  els.clearLen.addEventListener('click', function(){ state.len = ''; setLenActive(''); setLoading('正在加载…'); queryList(0); });
  els.searchBtn.addEventListener('click', doSearch);
  els.input.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSearch(); });

  (async function init(){
    setLoading('正在加载成语…');
    var res = await sb.auth.getSession();
    if(!res.data || !res.data.session){
      state.ready = false;
      setLoggedOut();
      return;
    }
    state.ready = true;
    var allBtn = els.letterFilters.querySelector('[data-mode="all"]');
    setLetterActive(allBtn, false);
    setLenActive('');
    await queryList(0);
  })();

})();
</script>
</body>
</html>
