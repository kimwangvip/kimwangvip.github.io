<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宝贝攒分啦 · 兑换玩平板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffd43b'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3E%E5%88%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#c8ecff; --bg2:#fff7e6;
    --ink:#5b4636;
    --accent:#ff6b6b; --accent2:#ffa94d;
    --card:#ffffff; --cream:#fff8e7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #d9f3ff 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, #e9f7ff 45%, var(--bg2) 100%);
    color:var(--ink);
    font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    overflow-x:hidden; padding-bottom:32px;
  }
  .deco{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .deco svg{position:absolute;}
  .cloud1{top:6%; left:-3%; width:170px; opacity:.9;}
  .cloud2{top:22%; right:-4%; width:210px; opacity:.85;}
  .star{width:32px; height:32px; animation:twinkle 3.2s ease-in-out infinite;}
  .star.s1{top:12%; left:14%;}
  .star.s2{top:36%; right:9%; animation-delay:.7s;}
  .star.s3{bottom:22%; right:24%; animation-delay:1.4s;}
  @keyframes twinkle{0%,100%{opacity:.35; transform:scale(.85) rotate(0)}50%{opacity:1; transform:scale(1.05) rotate(18deg)}}
  .wrap{position:relative; z-index:1; max-width:620px; margin:0 auto; padding:16px 16px 30px; text-align:center;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .title{font-size:38px; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.12), 0 6px 14px rgba(255,140,80,.35); letter-spacing:2px; line-height:1;}
  .title .tw{color:#ffd43b;}
  .subtitle{font-size:15px; color:#6b5a47; opacity:.9; margin-top:6px;}
  .soundbtn{
    width:44px; height:44px; border-radius:50%; border:3px solid #fff; cursor:pointer;
    background:linear-gradient(180deg,#ffd43b,#ff9f1a); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 #d97e00, 0 8px 16px rgba(255,150,20,.35); transition:transform .12s;
  }
  .soundbtn:active{transform:translateY(3px); box-shadow:0 1px 0 #d97e00;}
  .soundbtn svg{width:22px; height:22px;}

  /* 积分钱包 */
  .wallet{
    margin:14px auto 0; max-width:430px; border-radius:20px; padding:14px 18px;
    background:linear-gradient(135deg,#fff3cd,#ffe0a3);
    border:3px solid #ffd43b; box-shadow:0 6px 0 rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .wallet .lbl{font-size:16px; color:#8a6a1a; text-align:left; line-height:1.3;}
  .wallet .pts{font-size:42px; font-weight:900; color:#e67e22; line-height:1;}
  .wallet .pts small{font-size:20px;}
  .wallet .btns{display:flex; gap:8px; flex-wrap:wrap;}
  .wallet .reset-btn{
    font-family:inherit; font-size:14px; color:#fff; cursor:pointer; border:none;
    border-radius:30px; padding:8px 16px; background:linear-gradient(180deg,#ff8787,#ff6b6b);
    box-shadow:0 3px 0 #e03131; letter-spacing:1px; transition:transform .1s;
  }
  .wallet .reset-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #e03131;}
  /* 兑换按钮（钱包内） */
  .wallet .exchange-btn{
    font-family:inherit; font-size:14px; color:#fff; cursor:pointer; border:none;
    border-radius:30px; padding:8px 16px; background:linear-gradient(180deg,#ffb347,#ff8c1a);
    box-shadow:0 3px 0 #c96f00; letter-spacing:1px; transition:transform .1s;
  }
  .wallet .exchange-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #c96f00;}
  .wallet .exchange-btn:disabled{
    opacity:.45; cursor:not-allowed;
    background:linear-gradient(180deg,#d9c8a8,#b8a68a);
    box-shadow:0 3px 0 #8f7e62;
  }

  /* 状态横幅 */
  .status{
    margin:14px auto 0; max-width:430px; min-height:50px; border-radius:18px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:18px; padding:10px 16px; line-height:1.4;
  }
  .status.lock{background:#fde2e2; border:3px solid #ffb3b3; color:#a43c3c;}
  .status.ok{background:#e6f7ec; border:3px solid #a9e6c0; color:#1e7a44;}
  .status.done{background:#eef1f6; border:3px solid #d3dae3; color:#6b7684;}
  .status svg{width:22px; height:22px; flex:none;}

  /* 转盘 */
  .stage{position:relative; width:min(80vw, 400px); margin:14px auto 0; aspect-ratio:1/1;}
  canvas.wheel{width:100%; height:100%; display:block; border-radius:50%;
    filter:drop-shadow(0 14px 26px rgba(90,60,40,.22));}
  .pointer{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:5;
    border-left:20px solid transparent; border-right:20px solid transparent; border-top:38px solid var(--accent);
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.22));
  }
  .pointer::after{
    content:''; position:absolute; top:-46px; left:-14px; width:28px; height:28px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #f0e0c0); border:3px solid #fff;
    box-shadow:0 3px 6px rgba(0,0,0,.18);
  }
  .spinbtn{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:120px; height:120px; border-radius:50%; border:6px solid #fff; cursor:pointer;
    background:radial-gradient(circle at 35% 28%, #ffd166, #ff9f1a 70%);
    color:#fff; font-family:inherit; font-size:26px; letter-spacing:2px;
    box-shadow:0 8px 0 #d97e00, 0 16px 30px rgba(200,110,0,.35);
    transition:transform .12s, box-shadow .12s; z-index:6;
  }
  .spinbtn:active{transform:translate(-50%,-46%); box-shadow:0 3px 0 #d97e00, 0 10px 18px rgba(200,110,0,.3);}
  .spinbtn:disabled{cursor:not-allowed; opacity:.6; background:radial-gradient(circle at 35% 28%, #d9d3c8, #b8b0a2 70%); box-shadow:0 4px 0 #8f877a, 0 10px 18px rgba(0,0,0,.1);}

  .actions{display:flex; gap:12px; justify-content:center; margin:16px auto 0; flex-wrap:wrap;}
  .btn{font-family:inherit; font-size:17px; color:#fff; cursor:pointer; border:none; border-radius:40px; padding:13px 24px; min-height:46px; letter-spacing:1px; box-shadow:0 5px 0 rgba(0,0,0,.16), 0 10px 18px rgba(0,0,0,.10); transition:transform .1s;}
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.16);}
  .btn-parent{background:linear-gradient(180deg,#4dabf7,#2f8fe0);}
  .btn-set{background:linear-gradient(180deg,#b197fc,#8f6ce8);}
  .btn:disabled{opacity:.5; cursor:default;}

  .result{margin:16px auto 0; max-width:420px; min-height:48px; background:var(--cream); border:3px dashed #ffd43b; border-radius:18px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:20px; color:#7a5a3a; padding:9px 16px; box-shadow:0 6px 0 rgba(0,0,0,.06);}
  .result .prize{color:var(--accent); font-size:26px;}

  .history{margin:20px auto 0; max-width:470px; background:rgba(255,255,255,.85); border-radius:18px; padding:14px 16px; text-align:left;}
  .history h3{margin:0 0 8px; font-size:17px; color:#6b5a47; display:flex; align-items:center; gap:6px;}
  .history h3 svg{width:20px; height:20px;}
  .history .list{display:flex; flex-wrap:wrap; gap:8px; min-height:26px;}
  .chip{background:#fff2cc; color:#8a5b00; border-radius:30px; padding:5px 13px; font-size:15px; border:2px solid #ffe08a; white-space:nowrap;}
  .empty{color:#b0a08d; font-size:15px; padding:4px 2px;}

  /* 弹层 */
  .overlay{position:fixed; inset:0; background:rgba(60,40,20,.42); display:none; align-items:center; justify-content:center; z-index:30; padding:16px;}
  .overlay.show{display:flex;}
  .panel{background:#fff; border-radius:24px; width:min(92vw, 430px); max-height:86vh; display:flex; flex-direction:column; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .panel h2{margin:0 0 4px; font-size:23px; color:#5b4636; text-align:center;}
  .panel p.hint{margin:0 0 14px; text-align:center; color:#9a8a76; font-size:14px;}
  .opts{flex:1; overflow-y:auto; padding-right:6px;}
  .optrow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .optrow .dot{width:16px; height:16px; border-radius:50%; flex:none;}
  .optrow .val{width:70px; font-family:inherit; font-size:16px; color:#5b4636; border:2px solid #e8dcc8; border-radius:10px; padding:8px 8px; text-align:center; outline:none;}
  .optrow .w{flex:1; font-family:inherit; font-size:14px; color:#5b4636; border:2px solid #e8dcc8; border-radius:10px; padding:8px 10px; outline:none;}
  .optrow .w:focus{border-color:#ffa94d;}
  .optrow .del{width:44px; height:44px; min-width:44px; min-height:44px; border:none; border-radius:10px; background:#ffe3e3; color:#ff6b6b; font-size:20px; cursor:pointer; line-height:1;}
  .optrow .note{font-size:11px; color:#b0a08d; width:52px; flex:none; text-align:left;}
  .panel .rowbtns{display:flex; gap:10px; margin-top:14px;}
  .btn-sm{flex:1; font-family:inherit; font-size:16px; color:#fff; border:none; border-radius:30px; padding:12px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.14);}
  .btn-add{background:linear-gradient(180deg,#69db7c,#40c057);}
  .btn-ok{background:linear-gradient(180deg,#ffa94d,#ff922b);}
  .btn-cancel{background:#b9ad9b; box-shadow:none;}

  /* 家长确认 */
  .confirm{text-align:center; padding:6px 4px;}
  .confirm .q{font-size:21px; color:#5b4636; margin-bottom:18px; line-height:1.5;}
  .confirm .btns{display:flex; flex-direction:column; gap:12px;}
  .confirm .yes{font-family:inherit; font-size:19px; color:#fff; border:none; border-radius:40px; padding:15px; background:linear-gradient(180deg,#69db7c,#40c057); box-shadow:0 5px 0 #2f9e44; cursor:pointer;}
  .confirm .no{font-family:inherit; font-size:17px; color:#fff; border:none; border-radius:40px; padding:12px; background:linear-gradient(180deg,#ff8787,#ff6b6b); box-shadow:0 4px 0 #e03131; cursor:pointer;}

  /* 中奖弹层 */
  .prize-pop{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .prize-pop.show{display:flex;}
  .prize-pop .box{background:#fff; border-radius:28px; padding:30px 26px; text-align:center; width:min(86vw, 340px); box-shadow:0 20px 60px rgba(0,0,0,.3); animation:pop .4s cubic-bezier(.22,1,.36,1);}
  .prize-pop .big{font-size:20px; color:#9a8a76;}
  .prize-pop .pts{font-size:56px; color:var(--accent); margin:6px 0 4px; font-weight:900;}
  .prize-pop .sub{font-size:16px; color:#9a8a76; margin-bottom:18px;}
  .prize-pop .again{font-family:inherit; font-size:19px; color:#fff; border:none; border-radius:40px; padding:13px 32px; background:linear-gradient(180deg,#ffd166,#ff9f1a); box-shadow:0 5px 0 #d97e00; cursor:pointer;}
  @keyframes pop{0%{transform:scale(.5); opacity:0}100%{transform:scale(1); opacity:1}}
  .confetti{position:fixed; top:-20px; z-index:40; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}

  /* 满100分祝贺弹层 */
  .milestone-pop{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
  .milestone-pop.show{display:flex;}
  .milestone-pop .box{
    background:linear-gradient(160deg,#fff9e6,#ffe8b8);
    border-radius:32px; padding:36px 28px; text-align:center;
    width:min(88vw, 360px); box-shadow:0 24px 70px rgba(200,120,0,.35);
    border:4px solid #ffd43b; animation:pop .5s cubic-bezier(.22,1,.36,1);
    position:relative; overflow:hidden;
  }
  .milestone-pop .box::before{
    content:'🎉'; position:absolute; top:-10px; left:10px; font-size:44px;
    animation:twinkle 1.6s ease-in-out infinite;
  }
  .milestone-pop .box::after{
    content:'🎊'; position:absolute; bottom:-6px; right:8px; font-size:44px;
    animation:twinkle 1.6s ease-in-out infinite .8s;
  }
  .milestone-pop .emoji{font-size:64px; line-height:1; margin-bottom:8px;}
  .milestone-pop .big{font-size:22px; color:#8a5b00; margin-bottom:6px; font-weight:700;}
  .milestone-pop .pts{font-size:58px; color:#e67e22; font-weight:900; margin:4px 0 6px; line-height:1;}
  .milestone-pop .sub{font-size:17px; color:#9a7a3a; margin-bottom:22px; line-height:1.5;}
  .milestone-pop .again{font-family:inherit; font-size:20px; color:#fff; border:none; border-radius:40px; padding:15px 40px;
    background:linear-gradient(180deg,#ffd166,#ff9f1a); box-shadow:0 6px 0 #d97e00; cursor:pointer; letter-spacing:2px;}
  .milestone-pop .again:active{transform:translateY(3px); box-shadow:0 3px 0 #d97e00;}

  /* 兑换确认弹层 */
  .exchange-panel .q{font-size:20px; line-height:1.6; color:#5b4636; margin-bottom:18px; text-align:center;}
  .exchange-panel .q strong{color:#e67e22; font-size:26px;}
  .exchange-panel .btns{display:flex; flex-direction:column; gap:12px;}
  .exchange-panel .yes{font-family:inherit; font-size:18px; color:#fff; border:none; border-radius:40px; padding:14px; background:linear-gradient(180deg,#69db7c,#40c057); box-shadow:0 5px 0 #2f9e44; cursor:pointer; letter-spacing:1px;}
  .exchange-panel .no{font-family:inherit; font-size:16px; color:#fff; border:none; border-radius:40px; padding:12px; background:linear-gradient(180deg,#ff8787,#ff6b6b); box-shadow:0 4px 0 #e03131; cursor:pointer;}

  @media (max-width:420px){ .title{font-size:32px;} .spinbtn{width:100px; height:100px; font-size:22px;} .wallet .pts{font-size:36px;} }
  @media (prefers-reduced-motion: reduce){ .star,.confetti{animation:none !important;} }
</style>
</head>
<body>
<!-- ===== 背景 ===== -->
<div class="deco" aria-hidden="true">
  <svg class="cloud1" viewBox="0 0 200 80"><path fill="#ffffff" opacity=".92" d="M30 65a22 22 0 0 1 2-44 30 30 0 0 1 58 4 24 24 0 0 1 8 40H30z"/></svg>
  <svg class="cloud2" viewBox="0 0 200 80"><path fill="#ffffff" opacity=".9" d="M30 65a22 22 0 0 1 2-44 30 30 0 0 1 58 4 24 24 0 0 1 8 40H30z"/></svg>
  <svg class="star s1" viewBox="0 0 24 24"><path fill="#ffd43b" d="M12 0l2.9 8.6L24 9.4l-6.8 5.4L19 24l-7-4.6L5 24l1.8-9.2L0 9.4l9.1-.8z"/></svg>
  <svg class="star s2" viewBox="0 0 24 24"><path fill="#ffa94d" d="M12 0l2.9 8.6L24 9.4l-6.8 5.4L19 24l-7-4.6L5 24l1.8-9.2L0 9.4l9.1-.8z"/></svg>
  <svg class="star s3" viewBox="0 0 24 24"><path fill="#f783ac" d="M12 0l2.9 8.6L24 9.4l-6.8 5.4L19 24l-7-4.6L5 24l1.8-9.2L0 9.4l9.1-.8z"/></svg>
</div>

<div class="wrap">
  <header class="topbar">
    <div style="flex:1; text-align:left;">
      <div class="title">宝贝<span class="tw">攒分啦</span></div>
      <div class="subtitle">每天乖乖的，就能抽积分换小奖励</div>
    </div>
    <button class="soundbtn" id="soundBtn" title="音效开关" aria-label="音效开关" aria-pressed="true">
      <svg id="soundOn" viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <svg id="soundOff" viewBox="0 0 24 24" fill="#fff" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8l6 8M22 8l-6 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- 积分钱包：兑换按钮放到清零旁边 -->
  <div class="wallet">
    <div class="lbl">
      攒到的积分
      <div style="font-size:12px; color:#b08a3a; margin-top:2px;" id="todayDate">—</div>
    </div>
    <div class="pts"><span id="totalPts">0</span><small> 分</small></div>
    <div class="btns">
      <button class="exchange-btn" id="exchangeBtn" disabled>🎮 兑换玩平板 (100分)</button>
      <button class="reset-btn" id="resetBtn" title="积分清零，重新开始">🔄 清零重记</button>
    </div>
  </div>

  <!-- 今日状态 -->
  <div class="status lock" id="statusBox">
    <svg id="stLock" viewBox="0 0 24 24" fill="#a43c3c"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/></svg>
    <span id="statusText">今天还没有确认表现，等爸爸妈妈点头才能抽哦</span>
  </div>

  <!-- 转盘 -->
  <div class="stage">
    <div class="pointer" aria-hidden="true"></div>
    <canvas class="wheel" id="wheel"></canvas>
    <button class="spinbtn" id="spinBtn" disabled>抽积分</button>
  </div>

  <!-- 按钮区域：只剩家长确认与设置 -->
  <div class="actions">
    <button class="btn btn-parent" id="parentBtn">（家长）确认今日表现</button>
    <button class="btn btn-set" id="setBtn">设置积分</button>
  </div>

  <div class="result" id="result">先让爸爸妈妈确认今天的表现哦</div>

  <div class="history">
    <h3>
      <svg viewBox="0 0 24 24" fill="#ff9f1a"><path d="M12 2l2.4 6.6L21 9.4l-5.2 4.2L17.4 20 12 16.4 6.6 20l1.6-6.4L3 9.4l6.6-.8z"/></svg>
      每天的积分记录
    </h3>
    <div class="list" id="histList"><span class="empty">还没有抽过积分哦</span></div>
  </div>
</div>

<!-- 家长确认 -->
<div class="overlay" id="confirmOv">
  <div class="panel">
    <h2>确认今日表现</h2>
    <div class="confirm">
      <div class="q">今天宝贝表现乖吗？<br>乖的话可以抽一次积分，不乖今天就不抽。</div>
      <div class="btns">
        <button class="yes" id="confirmYes">很乖，今天可以抽积分</button>
        <button class="no" id="confirmNo">今天不乖，不能抽</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="setOv">
  <div class="panel">
    <h2>设置积分档位</h2>
    <p class="hint">分数越大越想要。数字填"权重"，越小越难抽中。默认 5分和30分最难抽到。</p>
    <div class="opts" id="opts"></div>
    <div class="rowbtns">
      <button class="btn-sm btn-add" id="addBtn">加一档</button>
      <button class="btn-sm btn-cancel" id="cancelBtn">取消</button>
      <button class="btn-sm btn-ok" id="okBtn">就用这些</button>
    </div>
  </div>
</div>

<!-- 兑换确认弹层 -->
<div class="overlay" id="exchangeOv">
  <div class="panel exchange-panel">
    <h2>兑换奖励</h2>
    <div class="q">确定要消耗 <strong>100分</strong> 兑换一次<br>「玩平板」奖励吗？</div>
    <div class="btns">
      <button class="yes" id="exchangeYes">✅ 确定兑换</button>
      <button class="no" id="exchangeNo">❌ 再想想</button>
    </div>
  </div>
</div>

<!-- 中奖弹层 -->
<div class="prize-pop" id="prizePop">
  <div class="box">
    <div class="big">恭喜宝贝，今天抽到</div>
    <div class="pts" id="prizePts">+10</div>
    <div class="sub" id="prizeSub">分，攒进积分罐啦</div>
    <button class="again" id="againBtn">收下啦</button>
  </div>
</div>

<!-- 满100分祝贺弹层 -->
<div class="milestone-pop" id="milestonePop">
  <div class="box">
    <div class="emoji">🏆</div>
    <div class="big">太棒啦！积攒满</div>
    <div class="pts">100分</div>
    <div class="sub">宝贝真厉害！<br>可以兑换小奖励啦～</div>
    <button class="again" id="milestoneBtn">开心收下</button>
  </div>
</div>

<!-- ===== 脚本 ===== -->
<script>
(function(){
  'use strict';

  // ---------- 数据 ----------
  var PALETTE = ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#f783ac','#38d9a9','#b197fc','#ff922b','#22d3ee'];
  var DEFAULT_OPTS = [{v:5,w:10},{v:10,w:25},{v:15,w:30},{v:20,w:25},{v:30,w:10}];
  var MILESTONE = 100;
  var EXCHANGE_COST = 100;

  var opts = load('bao_pts_opts', null) || DEFAULT_OPTS.map(function(o){return {v:o.v,w:o.w};});
  var totalPoints = load('bao_pts_total', 0);
  var hist = load('bao_pts_hist', []);
  var soundOn = load('bao_wheel_sound', true);
  var today = load('bao_pts_today', null);

  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function todayDisplay(){ var d=new Date(); var week=['日','一','二','三','四','五','六'][d.getDay()]; return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+week; }
  function resetTodayIfNeeded(){
    var ts = todayStr();
    if(!today || today.date !== ts){ today = {date:ts, allowed:false, drawn:false, got:0}; }
  }
  resetTodayIfNeeded();

  function load(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function saveAll(){ save('bao_pts_opts',opts); save('bao_pts_total',totalPoints); save('bao_pts_hist',hist); save('bao_pts_today',today); }

  // ---------- 音效 ----------
  var ac=null, audioStarted=false;
  function ensureAudio(){ if(!audioStarted){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} if(ac&&ac.state==='suspended')ac.resume(); audioStarted=true; } }
  function beep(f,dur,type,vol,delay){ if(!soundOn||!ac)return; var t=ac.currentTime+(delay||0); var o=ac.createOscillator(),g=ac.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12)); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+(dur||0.12)+0.02); }
  function tickSound(i){ beep(420+(i%8)*40,0.05,'square',0.12); }
  function winSound(){ [523,659,784,1046].forEach(function(f,i){ beep(f,0.22,'triangle',0.3,i*0.13); }); beep(1318,0.4,'triangle',0.28,0.55); }
  function milestoneSound(){ [523,659,784,1046,1318,1568].forEach(function(f,i){ beep(f,0.3,'triangle',0.32,i*0.14); }); }
  function exchangeSound(){ [600,800,1000].forEach(function(f,i){ beep(f,0.15,'sine',0.25,i*0.1); }); }

  // ---------- 转盘 ----------
  var canvas=document.getElementById('wheel'), ctx=canvas.getContext('2d');
  var off=document.createElement('canvas'), offx=off.getContext('2d');
  var angle=0, spinning=false, radius=0, cx=0, cy=0;
  var segs=[];

  function totalW(){ return opts.reduce(function(s,o){return s+o.w;},0); }
  function setupCanvas(){
    var dpr=Math.min(window.devicePixelRatio||1,2.5);
    var size=canvas.clientWidth||canvas.clientHeight||360; if(size<=0)size=360;
    canvas.width=Math.round(size*dpr); canvas.height=Math.round(size*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    radius=Math.max(10,size/2-3); cx=size/2; cy=size/2;
  }
  function buildWheel(highlight){
    var dpr=Math.min(window.devicePixelRatio||1,2.5);
    off.width=canvas.width; off.height=canvas.height;
    offx.setTransform(dpr,0,0,dpr,0,0);
    var total=totalW(), a0=-Math.PI/2, cursor=a0;
    segs=[];
    var fontPx=Math.max(15,Math.round(cx*2*0.055));
    offx.font='900 '+fontPx+'px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
    offx.textAlign='center'; offx.textBaseline='middle';
    for(var i=0;i<opts.length;i++){
      var ang=(opts[i].w/total)*Math.PI*2;
      var start=cursor, end=cursor+ang;
      segs.push({start:start,end:end,idx:i});
      var col=PALETTE[i%PALETTE.length];
      if(highlight===i) col=lighten(col,0.18);
      offx.beginPath(); offx.moveTo(cx,cy); offx.arc(cx,cy,radius,start,end); offx.closePath();
      offx.fillStyle=col; offx.fill();
      offx.strokeStyle='rgba(255,255,255,.9)'; offx.lineWidth=2.5;
      offx.beginPath(); offx.moveTo(cx,cy); offx.lineTo(cx+radius*Math.cos(start),cy+radius*Math.sin(start)); offx.stroke();
      var mid=start+ang/2;
      var norm=((mid%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      offx.save(); offx.translate(cx,cy); offx.rotate(mid);
      var dist=radius*0.52, flip=(norm>Math.PI/2&&norm<Math.PI*3/2);
      if(flip){ offx.rotate(Math.PI); dist=-dist; }
      var txt=opts[i].v+'分';
      offx.strokeStyle='rgba(255,255,255,.92)'; offx.lineWidth=fontPx*0.3; offx.lineJoin='round';
      offx.strokeText(txt,dist,0);
      offx.fillStyle='#5b3a2a'; offx.fillText(txt,dist,0);
      offx.restore();
      cursor=end;
    }
    offx.beginPath(); offx.arc(cx,cy,radius,0,Math.PI*2); offx.strokeStyle='#fff'; offx.lineWidth=6; offx.stroke();
    offx.beginPath(); offx.arc(cx,cy,radius*0.88,0,Math.PI*2); offx.strokeStyle='rgba(255,255,255,.5)'; offx.lineWidth=3; offx.stroke();
    var lamps=opts.length*2, lr=radius*0.965;
    for(var k=0;k<lamps;k++){
      var la=-Math.PI/2+(k+0.5)*(Math.PI*2/lamps);
      offx.beginPath(); offx.arc(cx+lr*Math.cos(la),cy+lr*Math.sin(la),Math.max(2.5,cx*0.008),0,Math.PI*2);
      offx.fillStyle=k%2?'#fff':'rgba(255,255,255,.55)'; offx.fill();
    }
  }
  function lighten(hex,amt){ var c=hex.replace('#',''); var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16); r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt); return 'rgb('+r+','+g+','+b+')'; }
  function draw(ang){ ctx.clearRect(0,0,cx*2,cy*2); ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang); ctx.drawImage(off,-cx,-cy,cx*2,cy*2); ctx.restore(); }

  // ---------- 加权随机 ----------
  function pickIndex(){ var total=totalW(), r=Math.random()*total, acc=0; for(var i=0;i<opts.length;i++){ acc+=opts[i].w; if(r<acc) return i; } return opts.length-1; }
  var rafId=null;
  function spin(){
    if(spinning) return;
    resetTodayIfNeeded();
    if(!today.allowed || today.drawn) { updateStatus(); return; }
    ensureAudio();
    var target=pickIndex();
    var mid=segs[target].start+(segs[target].end-segs[target].start)/2;
    var need=(((-Math.PI/2-mid)%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    var full=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    var delta=((need-full)+(Math.PI*2))%(Math.PI*2);
    var final=angle+(4+Math.floor(Math.random()*3))*Math.PI*2+delta;
    var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){ angle=final; draw(final); finish(target); return; }
    spinning=true; var btn=document.getElementById('spinBtn'); btn.disabled=true;
    var startT=performance.now(), dur=4600, startAngle=angle, lastIndex=-1;
    cancelAnimationFrame(rafId);
    function frame(now){
      var p=Math.min(1,(now-startT)/dur), e=1-Math.pow(2,-10*p);
      angle=startAngle+(final-startAngle)*e; draw(angle);
      var count=Math.floor((angle-startAngle)/(Math.PI*2/opts.length));
      if(count!==lastIndex){ lastIndex=count; if(soundOn)tickSound(count); }
      if(p<1){ rafId=requestAnimationFrame(frame); }
      else{ angle=final; spinning=false; btn.disabled=true; buildWheel(target); draw(final); finish(target); }
    }
    rafId=requestAnimationFrame(frame);
  }

  var milestoneShown = false;
  function checkMilestoneOnLoad(){
    if(totalPoints >= MILESTONE){ milestoneShown = true; }
  }

  function finish(target){
    winSound(); confetti();
    var v=opts[target].v;
    var prevTotal = totalPoints;
    totalPoints+=v; today.drawn=true; today.got=v;
    hist.unshift({d:todayStr().slice(5), p:v, full:todayStr()}); if(hist.length>20)hist=hist.slice(0,20);
    saveAll();
    document.getElementById('totalPts').textContent=totalPoints;
    document.getElementById('result').innerHTML='今天抽到 <span class="prize">+'+v+' 分</span>，真棒！';
    document.getElementById('prizePts').textContent='+'+v;
    document.getElementById('prizeSub').textContent='分，攒进积分罐啦（现有 '+totalPoints+' 分）';
    document.getElementById('prizePop').classList.add('show');
    renderHist(); updateStatus();
    setTimeout(function(){ buildWheel(-1); draw(angle); },900);

    if(!milestoneShown && prevTotal < MILESTONE && totalPoints >= MILESTONE){
      milestoneShown = true;
      setTimeout(function(){
        document.getElementById('milestonePop').classList.add('show');
        milestoneSound();
        bigConfetti();
      }, 1200);
    }
    updateExchangeBtn();
  }

  function confetti(){
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    for(var i=0;i<44;i++){ var c=document.createElement('div'); c.className='confetti'; var s=6+Math.random()*8; c.style.cssText='left:'+(Math.random()*100)+'vw;width:'+s+'px;height:'+(s*(Math.random()>.5?1:1.6))+'px;background:'+PALETTE[i%PALETTE.length]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';animation-duration:'+(2.2+Math.random()*2)+'s;animation-delay:'+(Math.random()*0.5)+'s;opacity:.9;'; document.body.appendChild(c); (function(el){ setTimeout(function(){el.remove();},5200); })(c); }
  }
  function bigConfetti(){
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    for(var i=0;i<80;i++){ var c=document.createElement('div'); c.className='confetti'; var s=8+Math.random()*12; c.style.cssText='left:'+(Math.random()*100)+'vw;width:'+s+'px;height:'+(s*(Math.random()>.5?1:1.6))+'px;background:'+PALETTE[i%PALETTE.length]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';animation-duration:'+(2.5+Math.random()*2.5)+'s;animation-delay:'+(Math.random()*0.8)+'s;opacity:.95;'; document.body.appendChild(c); (function(el){ setTimeout(function(){el.remove();},6000); })(c); }
  }

  // ---------- 状态UI与兑换按钮状态 ----------
  function updateStatus(){
    resetTodayIfNeeded();
    var box=document.getElementById('statusBox'), txt=document.getElementById('statusText'), btn=document.getElementById('spinBtn');
    box.classList.remove('lock','ok','done');
    if(!today.allowed){ box.classList.add('lock'); txt.textContent='今天还没有确认表现，等爸爸妈妈点头才能抽哦'; btn.disabled=true; document.getElementById('result').innerHTML='先让爸爸妈妈确认今天的表现哦'; }
    else if(!today.drawn){ box.classList.add('ok'); txt.textContent='今天表现很棒！可以抽一次积分啦'; btn.disabled=false; document.getElementById('result').innerHTML='准备好，抽今天的积分！'; }
    else{ box.classList.add('done'); txt.textContent='今天已经抽过啦（+'+today.got+'分），明天再加油！'; btn.disabled=true; }
    updateExchangeBtn();
  }

  function updateExchangeBtn(){
    var exBtn = document.getElementById('exchangeBtn');
    if(totalPoints >= EXCHANGE_COST){
      exBtn.disabled = false;
      exBtn.textContent = '🎮 兑换玩平板 (100分)';
    } else {
      exBtn.disabled = true;
      exBtn.textContent = '🎮 兑换玩平板 (100分)';
    }
  }

  function doExchange(){
    if(totalPoints < EXCHANGE_COST) return;
    totalPoints -= EXCHANGE_COST;
    hist.unshift({d:todayStr().slice(5), p:-EXCHANGE_COST, full:todayStr() + ' 兑换玩平板'});
    if(hist.length>20)hist=hist.slice(0,20);
    saveAll();
    document.getElementById('totalPts').textContent = totalPoints;
    document.getElementById('result').innerHTML = '🎉 成功兑换「玩平板」奖励！<span class="prize">-100分</span>';
    renderHist();
    updateStatus();
    updateExchangeBtn();
    ensureAudio();
    exchangeSound();
    document.getElementById('exchangeOv').classList.remove('show');
  }

  // ---------- 历史 ----------
  function renderHist(){
    var box=document.getElementById('histList');
    if(!hist.length){ box.innerHTML='<span class="empty">还没有抽过积分哦</span>'; return; }
    box.innerHTML=hist.map(function(h){
      var dateStr = h.full || h.d;
      if(h.p < 0) {
        return '<span class="chip" style="background:#ffe3e3; color:#c92a2a; border-color:#ffa8a8;">'+dateStr+' · 玩平板(-'+Math.abs(h.p)+'分)</span>';
      } else {
        return '<span class="chip">'+dateStr+' · +'+h.p+'分</span>';
      }
    }).join('');
  }

  // ---------- 清零 ----------
  function resetPoints(){
    if(!confirm('确定要清零积分重新开始吗？\n所有积分记录也会一起清空哦。')) return;
    totalPoints = 0;
    hist = [];
    milestoneShown = false;
    saveAll();
    document.getElementById('totalPts').textContent = '0';
    document.getElementById('result').innerHTML = '积分已清零，重新开始攒分吧！';
    renderHist();
    updateStatus();
    updateExchangeBtn();
    ensureAudio();
    beep(660,0.1,'triangle',0.2);
    beep(440,0.15,'triangle',0.2,0.12);
  }

  // ---------- 设置 ----------
  function renderOpts(){
    var box=document.getElementById('opts'); box.innerHTML='';
    opts.forEach(function(o,i){
      var row=document.createElement('div'); row.className='optrow';
      var dot=document.createElement('span'); dot.className='dot'; dot.style.background=PALETTE[i%PALETTE.length];
      var val=document.createElement('input'); val.className='val'; val.type='number'; val.min='1'; val.max='100'; val.value=o.v;
      var w=document.createElement('input'); w.className='w'; w.type='number'; w.min='1'; w.max='100'; w.value=o.w;
      w.setAttribute('aria-label','权重（越大越容易抽中）');
      var note=document.createElement('span'); note.className='note'; note.textContent='权重';
      var del=document.createElement('button'); del.className='del'; del.textContent='x';
      val.addEventListener('input',function(){ o.v=Math.max(1,Math.min(100,parseInt(val.value)||1)); });
      w.addEventListener('input',function(){ o.w=Math.max(1,Math.min(100,parseInt(w.value)||1)); });
      del.addEventListener('click',function(){ if(opts.length<=2)return; opts.splice(i,1); renderOpts(); });
      row.appendChild(dot); row.appendChild(val); row.appendChild(note); row.appendChild(w); row.appendChild(del);
      box.appendChild(row);
    });
  }
  function openSet(){ renderOpts(); document.getElementById('setOv').classList.add('show'); }
  function closeSet(){ document.getElementById('setOv').classList.remove('show'); }
  function saveSet(){
    var clean=[];
    opts.forEach(function(o){ var v=parseInt(o.v)||0, w=parseInt(o.w)||1; if(v>0&&w>0) clean.push({v:v,w:w}); });
    if(clean.length<2){ closeSet(); return; }
    if(clean.length>10) clean=clean.slice(0,10);
    opts=clean; saveAll(); setupCanvas(); buildWheel(-1); draw(angle); closeSet(); updateStatus();
  }

  // ---------- 事件绑定 ----------
  document.getElementById('spinBtn').addEventListener('click',spin);
  document.getElementById('parentBtn').addEventListener('click',function(){ document.getElementById('confirmOv').classList.add('show'); });
  document.getElementById('confirmYes').addEventListener('click',function(){ today.allowed=true; today.drawn=false; saveAll(); document.getElementById('confirmOv').classList.remove('show'); updateStatus(); });
  document.getElementById('confirmNo').addEventListener('click',function(){ today.allowed=false; today.drawn=false; saveAll(); document.getElementById('confirmOv').classList.remove('show'); updateStatus(); });
  document.getElementById('confirmOv').addEventListener('click',function(e){ if(e.target===this)this.classList.remove('show'); });
  document.getElementById('setBtn').addEventListener('click',openSet);
  document.getElementById('addBtn').addEventListener('click',function(){ if(opts.length>=10)return; opts.push({v:5,w:10}); renderOpts(); var b=document.getElementById('opts'); b.scrollTop=b.scrollHeight; });
  document.getElementById('okBtn').addEventListener('click',saveSet);
  document.getElementById('cancelBtn').addEventListener('click',closeSet);
  document.getElementById('setOv').addEventListener('click',function(e){ if(e.target===this)closeSet(); });
  document.getElementById('againBtn').addEventListener('click',function(){ document.getElementById('prizePop').classList.remove('show'); });
  document.getElementById('milestoneBtn').addEventListener('click',function(){ document.getElementById('milestonePop').classList.remove('show'); });
  document.getElementById('resetBtn').addEventListener('click',resetPoints);

  // 兑换按钮（现在位于钱包内）
  document.getElementById('exchangeBtn').addEventListener('click', function(){
    if(totalPoints < EXCHANGE_COST) return;
    document.getElementById('exchangeOv').classList.add('show');
  });
  document.getElementById('exchangeYes').addEventListener('click', doExchange);
  document.getElementById('exchangeNo').addEventListener('click', function(){
    document.getElementById('exchangeOv').classList.remove('show');
  });
  document.getElementById('exchangeOv').addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('show');
  });

  var sb=document.getElementById('soundBtn');
  function syncSound(){ document.getElementById('soundOn').style.display=soundOn?'block':'none'; document.getElementById('soundOff').style.display=soundOn?'none':'block'; sb.setAttribute('aria-pressed',String(soundOn)); }
  sb.addEventListener('click',function(){ soundOn=!soundOn; save('bao_wheel_sound',soundOn); syncSound(); if(soundOn)ensureAudio(); });

  // ---------- 初始化 ----------
  window.addEventListener('resize',function(){ setupCanvas(); buildWheel(-1); draw(angle); });
  setupCanvas(); buildWheel(-1); draw(0);
  document.getElementById('totalPts').textContent=totalPoints;
  document.getElementById('todayDate').textContent = todayDisplay();
  checkMilestoneOnLoad();
  renderHist(); updateStatus(); syncSound();
  updateExchangeBtn();

  setInterval(function(){
    document.getElementById('todayDate').textContent = todayDisplay();
  }, 60000);

})();
</script>
</body>
</html>
